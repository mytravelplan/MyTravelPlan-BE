  /api/carts:
    get:
      tags:
      - api
      operationId: cart-list
      parameters:
      - name: Authorization
        in: header
        description: Bearer 액세스 토큰 (USER 또는 ADMIN 권한 필요)
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwicm9sZXMiOlsiVVNFUiJdLCJleHAiOjE3NjU3OTI2MzV9.o41YHBqPDAPkYkyQQo_tGE3A1JFsJ2TcbjAJ_Z1rv8k
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-carts-465712130"
              examples:
                cart-list:
                  value: |-
                    {
                      "success" : true,
                      "data" : [ {
                        "id" : 1,
                        "productId" : 1,
                        "quantity" : 2
                      }, {
                        "id" : 2,
                        "productId" : 2,
                        "quantity" : 3
                      } ]
                    }
      security:
      - bearerAuthJWT: []
    post:
      tags:
      - api
      operationId: cart-add
      parameters:
      - name: Authorization
        in: header
        description: Bearer 액세스 토큰 (USER 또는 ADMIN 권한 필요)
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwicm9sZXMiOlsiVVNFUiJdLCJleHAiOjE3NjU3OTI2MzV9.o41YHBqPDAPkYkyQQo_tGE3A1JFsJ2TcbjAJ_Z1rv8k
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-carts496983015"
            examples:
              cart-add:
                value: |-
                  {
                    "productId" : 1,
                    "quantity" : 2
                  }
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-carts-769767084"
              examples:
                cart-add:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "productId" : 1,
                        "quantity" : 2
                      }
                    }
      security:
      - bearerAuthJWT: []

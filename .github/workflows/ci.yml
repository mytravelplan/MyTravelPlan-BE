name: CI Pipeline

on:
  pull_request:
    branches: [develop, main] # feature -> develop, develop -> main 으로 PR이 생기면 이벤트 발생
  push:
    branches: [develop, main] # develop, main 브랜치에 푸시(merge)될 때 이벤트 발생

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # badge 커밋/푸시용
      pull-requests: write   # jacoco-report 가 PR 코멘트/체크 쓰는 경우
    env:
      JWT_ACCESS_TOKEN_SECRET_KEY: ${{ secrets.JWT_ACCESS_TOKEN_SECRET_KEY }}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${{ secrets.JWT_REFRESH_TOKEN_SECRET_KEY }}
      JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
      JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}

      AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
      AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}

      REDIS_HOST: redis
      REDIS_PORT: 6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 빌드 및 테스트
      - name: Build with Gradle

        run: ./gradlew clean build

      # JaCoCo 테스트 커버리지 리포트 생성
      - name: Test Coverage Report
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          title: Test Coverage Report
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          update-comment: true

      # 커버리지 임계치 미달 시 실패 처리
      - name: Fail if coverage is below 80%
        if: github.event_name == 'pull_request' && (steps.jacoco.outputs.coverage-overall < 80 || steps.jacoco.outputs.coverage-changed-files < 80)
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Overall coverage is less than 80%!')
#        run: |
#          echo "Overall Project Coverage is below 80% - Current: ${{ steps.jacoco.outputs.coverage-overall }}%"
#          echo "Files changed Coverage is below 80% - Current: ${{ steps.jacoco.outputs.coverage-changed-files }}%"
#          exit 1


      # 커버리지 배지 생성 (Push 시에만 실행)
      - name: Generate JaCoCo Coverage Badge
        if: github.event_name == 'push'
        uses: cicirello/jacoco-badge-generator@v2.12.1
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv

      - name: Commit the badge (if it changed)
        if: github.event_name == 'push'
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --global user.name 'cksguddl0403'
            git config --global user.email 'cksguddl0403@users.noreply.github.com'
            git add -A
            git commit -m "Autogenerated JaCoCo coverage badge"
            git push
          fi
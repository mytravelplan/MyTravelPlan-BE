name: CD Pipeline

on:
  pull_request:
    branches:
      - main
    types: [closed]

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  EC2_KEY: ${{ secrets.EC2_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}

  AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
  AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
  AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}

  JWT_ACCESS_TOKEN_SECRET_KEY: ${{ secrets.JWT_ACCESS_TOKEN_SECRET_KEY }}
  JWT_REFRESH_TOKEN_SECRET_KEY: ${{ secrets.JWT_REFRESH_TOKEN_SECRET_KEY }}
  JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
  JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}

  REDIS_HOST: redis
  REDIS_PORT: 6379

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build
        env:
          AWS_S3_ACCESS_KEY: ${{ env.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ env.AWS_S3_SECRET_KEY }}
          AWS_S3_REGION: ${{ env.AWS_S3_REGION }}

          JWT_ACCESS_TOKEN_SECRET_KEY: ${{ env.JWT_ACCESS_TOKEN_SECRET_KEY }}
          JWT_REFRESH_TOKEN_SECRET_KEY: ${{ env.JWT_REFRESH_TOKEN_SECRET_KEY }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ env.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ env.JWT_REFRESH_TOKEN_EXPIRATION }}

          REDIS_HOST: redis
          REDIS_PORT: 6379

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPOSITORY }} .

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPOSITORY }}:latest

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ env.EC2_USER }}/"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_KEY }}
          script: |
            echo "SPRING_PROFILES_ACTIVE=prod" > .env
            echo "DOCKER_USERNAME=${{ env.DOCKER_USERNAME }}" >> .env
            echo "DOCKER_REPOSITORY=${{ env.DOCKER_REPOSITORY }}" >> .env
            echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> .env
            echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> .env
            echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> .env
            echo "AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}" >> .env
            echo "AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}" >> .env
            echo "AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}" >> .env
            echo "JWT_ACCESS_TOKEN_SECRET_KEY=${{ secrets.JWT_ACCESS_TOKEN_SECRET_KEY }}" >> .env
            echo "JWT_REFRESH_TOKEN_SECRET_KEY=${{ secrets.JWT_REFRESH_TOKEN_SECRET_KEY }}" >> .env
            echo "JWT_ACCESS_TOKEN_EXPIRATION=${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}" >> .env
            echo "JWT_REFRESH_TOKEN_EXPIRATION=${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}" >> .env
            echo "REDIS_HOST=redis" >> .env
            echo "REDIS_PORT=6379" >> .env

            # Docker Hub에서 최신 이미지 pull
            docker compose -f docker-compose.prod.yml pull
            
            # 컨테이너 재실행
            docker compose -f docker-compose.prod.yml up -d
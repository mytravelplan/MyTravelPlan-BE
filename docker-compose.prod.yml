services:
  mytravelplan:
    image: ${DOCKER_USERNAME}/${DOCKER_REPOSITORY}:latest
    container_name: mytravelplan-app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on: # Redis가 먼저 실행되고, 스프링 부트 애플리케이션이 실행되도록 설정
      - redis
    networks:
      - mytravelplan-network

  redis:
    image: redis:latest
    container_name: mytravelplan-redis
    ports:
      - "6379:6379"
    networks:
      - mytravelplan-network

networks:
  mytravelplan-network:
    driver: bridge